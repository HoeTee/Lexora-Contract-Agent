services:
  redis-v10:
    image: redis:v10
    container_name: lexora-redis-v10
    restart: unless-stopped
    ports:
      - "0.0.0.0:6390:6379"

  lexora-v10:
    extra_hosts: []
    image: lexora:v10
    container_name: lexora-api-v10
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis-v10
    command: ["/app/host", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "0.0.0.0:5010:8000"
    cpus: "1"
    mem_limit: 2g
    mem_reservation: 2g
    volumes:
      - ./.env:/app/.env:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./prompts.yaml:/app/agents/prompts.yaml:ro
      - ./criteria-routes.yaml:/app/resources/criteria/criteria-routes.yaml:ro
      - ./profiles:/app/profiles
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  review-worker-1-v10:
    extra_hosts: []
    image: lexora:v10
    container_name: lexora-worker-1-v10
    restart: unless-stopped
    env_file:
      - .env
    command: ["/app/host", "-m", "celery", "-A", "task_queue.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1", "--pool=prefork"]
    depends_on:
      - redis-v10
    cpus: "1"
    mem_limit: 2g
    mem_reservation: 2g
    volumes:
      - ./.env:/app/.env:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./prompts.yaml:/app/agents/prompts.yaml:ro
      - ./criteria-routes.yaml:/app/resources/criteria/criteria-routes.yaml:ro
      - ./profiles:/app/profiles
      - ./data:/app/data

  review-worker-2-v10:
    extra_hosts: []
    image: lexora:v10
    container_name: lexora-worker-2-v10
    restart: unless-stopped
    env_file:
      - .env
    command: ["/app/host", "-m", "celery", "-A", "task_queue.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1", "--pool=prefork"]
    depends_on:
      - redis-v10
    cpus: "1"
    mem_limit: 2g
    mem_reservation: 2g
    volumes:
      - ./.env:/app/.env:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./prompts.yaml:/app/agents/prompts.yaml:ro
      - ./criteria-routes.yaml:/app/resources/criteria/criteria-routes.yaml:ro
      - ./profiles:/app/profiles
      - ./data:/app/data

  review-worker-3-v10:
    extra_hosts: []
    image: lexora:v10
    container_name: lexora-worker-3-v10
    restart: unless-stopped
    env_file:
      - .env
    command: ["/app/host", "-m", "celery", "-A", "task_queue.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1", "--pool=prefork"]
    depends_on:
      - redis-v10
    cpus: "1"
    mem_limit: 2g
    mem_reservation: 2g
    volumes:
      - ./.env:/app/.env:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./prompts.yaml:/app/agents/prompts.yaml:ro
      - ./criteria-routes.yaml:/app/resources/criteria/criteria-routes.yaml:ro
      - ./profiles:/app/profiles
      - ./data:/app/data
