<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lexora 合同审查服务文档</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316806d'/%3E%3Cpath d='M19 14h18l8 8v28H19z' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M37 14v10h8' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="assets/portal.css">
    <script src="assets/portal-data.js" defer></script>
    <script src="assets/portal-content.js" defer></script>
    <script src="assets/portal.js" defer></script>
  </head>
  <body>
    <svg aria-hidden="true" class="icon-sprite">
      <symbol id="icon-api" viewBox="0 0 24 24"><path d="M4 7h6v10H4zM14 7h6v10h-6zM10 12h4M7 4v3M17 4v3M7 17v3M17 17v3"/></symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 6.5h7l2 2h9v9.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="icon-flow" viewBox="0 0 24 24"><path d="M5 6h5v5H5zM14 13h5v5h-5zM10 8.5h2.5A3.5 3.5 0 0 1 16 12v1M12 16.5H7.5A3.5 3.5 0 0 1 4 13v-2"/></symbol>
      <symbol id="icon-log" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></symbol>
      <symbol id="icon-docker" viewBox="0 0 24 24"><path d="M4 13h16l-1.5 4.5A4 4 0 0 1 14.7 20H8.2A4.2 4.2 0 0 1 4 15.8zM7 9h3v3H7zM11 9h3v3h-3zM11 5h3v3h-3zM15 9h3v3h-3z"/></symbol>
      <symbol id="icon-user" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0"/></symbol>
      <symbol id="icon-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 13h6M9 17h6"/></symbol>
      <symbol id="icon-code" viewBox="0 0 24 24"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><path d="m20 20-4.5-4.5M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"/></symbol>
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7M6 10v9h12v-9"/></symbol>
      <symbol id="icon-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    </svg>

    <div class="shell">
      <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="展开文档导航">
        <svg><use href="#icon-menu"></use></svg>
        <span>文档</span>
      </button>

      <aside id="sidebar" class="sidebar" aria-label="文档导航">
        <a class="brand" href="index.html" aria-label="Lexora 合同审查服务文档">
          <span class="brand-mark">L</span>
          <span>
            <strong>Lexora 文档</strong>
            <small>合同审查服务指南</small>
          </span>
        </a>
        <div class="search-box">
          <svg><use href="#icon-search"></use></svg>
          <input id="searchInput" type="search" placeholder="搜索使用、API、状态、部署">
        </div>

        <button id="homeButton" class="home-link" type="button">
          <svg><use href="#icon-home"></use></svg>
          <span>使用总览</span>
        </button>

        <div class="filter-row">
          <button class="filter-button active" data-filter="all">全部</button>
          <button class="filter-button" data-filter="start">入门</button>
          <button class="filter-button" data-filter="usage">使用</button>
          <button class="filter-button" data-filter="api">API</button>
          <button class="filter-button" data-filter="deploy">部署</button>
          <button class="filter-button" data-filter="support">排查</button>
        </div>

        <nav id="docNav" class="doc-nav"></nav>
      </aside>

      <main class="content">
        <!-- ===== 首页态：使用总览 ===== -->
        <section id="homeView" class="view">
          <header class="view-head">
            <h1>合同审查服务文档</h1>
            <p>了解如何提交合同、查看审查进度、理解任务状态并取得批注版 DOCX。</p>
          </header>

          <section class="arch-panel" aria-label="合同审查使用流程">
            <div class="panel-header">
              <span class="panel-icon"><svg><use href="#icon-flow"></use></svg></span>
              <div>
                <h2>使用流程</h2>
                <p>点击任一步骤查看对应说明。</p>
              </div>
            </div>
            <div class="arch-canvas" id="archDiagram"></div>
            <div class="arch-legend">
              <span class="legend-item legend-io">提交 / 下载</span>
              <span class="legend-item legend-core">任务处理</span>
              <span class="legend-item legend-agent">状态查看</span>
              <span class="legend-item legend-store">结果信息</span>
            </div>
          </section>

          <section class="overview-grid" aria-label="文档总览">
            <article class="overview-panel">
              <div class="panel-header">
                <span class="panel-icon"><svg><use href="#icon-flow"></use></svg></span>
                <div>
                  <h2>最短使用路径</h2>
                  <p>从提交合同到取得审查结果。</p>
                </div>
              </div>
              <div class="flow-line" id="primaryFlow"></div>
            </article>

            <article class="overview-panel">
              <div class="panel-header">
                <span class="panel-icon"><svg><use href="#icon-folder"></use></svg></span>
                <div>
                  <h2>状态响应重点</h2>
                  <p>查询任务时优先关注这些公开信息。</p>
                </div>
              </div>
              <pre class="directory-tree" id="directoryTree"></pre>
            </article>
          </section>
        </section>

        <!-- ===== 文档态：单篇内容 ===== -->
        <section id="docView" class="view hidden">
          <button id="backButton" class="back-link" type="button">
            <svg><use href="#icon-back"></use></svg>
            <span>返回使用总览</span>
          </button>

          <header class="doc-head">
            <span class="doc-icon" id="docIcon"><svg><use href="#icon-doc"></use></svg></span>
            <div>
              <h1 id="docTitle"></h1>
              <p id="docSummary"></p>
              <div id="docTags" class="tag-list"></div>
            </div>
          </header>

          <article id="docContent" class="doc-content"></article>

        </section>
      </main>
    </div>
  </body>
</html>
