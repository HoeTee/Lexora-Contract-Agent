llm:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  name: "qwen3.6-27b"
  enable_thinking: false
  max_context_tokens: 254000
  max_result_tokens: 64000
  max_tool_calls: 25
  temperature: 0.0
  top_p: 0.01
  seed: 42

embedding:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  name: "text-embedding-v4"
  max_input_tokens: 8000

rerank:
  base_url: "http://higress.llmgateway.dev.qa.zrub.com/v1/rerank"
  name: "Qwen3-Reranker-8B"
  instruct: "Given a contract review query, retrieve relevant institutional policy passages."
  provider_model_names:
    higress_qwen:
      - "Qwen3-Reranker-8B"
    bge:
      - "bge-reranker-v2-m3"
    dashscope_qwen:
      - "gte-rerank-v2"

workflow:
  max_reflection_rounds: 3
  max_orchestrator_concurrency: 5
  max_api_concurrent_reviews: 1
  model_call_timeout_seconds: 30
  model_call_max_retries: 1
  criterion_retry_max_attempts: 1
  subagent_allowed_tools:
    - "contract_search"

queue:
  enabled: true
  broker_url: "redis://localhost:6379/0"

model_semaphore:
  llm:
    enabled: false
    max_concurrent_requests: 5
    redis_url: "redis://localhost:6379/2"
    key: "contract_agent:model:llm:semaphore"
    wait_timeout_seconds: 600
    lease_seconds: 600
    poll_interval_seconds: 0.2
  embedding:
    enabled: false
    max_concurrent_requests: 3
    redis_url: "redis://localhost:6379/2"
    key: "contract_agent:model:embedding:semaphore"
    wait_timeout_seconds: 600
    lease_seconds: 600
    poll_interval_seconds: 0.2
  reranker:
    enabled: false
    max_concurrent_requests: 5
    redis_url: "redis://localhost:6379/2"
    key: "contract_agent:model:reranker:semaphore"
    wait_timeout_seconds: 600
    lease_seconds: 600
    poll_interval_seconds: 0.2

retrieval:
  backend: "llamaindex"
  llamaindex:
    chunk_size: 512
    chunk_overlap: 100
    similarity_top_k: 10
    rerank_top_n: 5
  docxindex:
    input_tokens: 20000
    output_tokens: 12000
    scan_batch_tokens: 12000
    vector:
      enabled: true
      score_threshold: 0.60
      auto_build: true
    rerank:
      enabled: true
    indexing:
      enrichment:
        llm_expand: false
        llm_summary: false
        llm_attachment_hierarchy: false
      heading:
        profiles:
          primary:
            level_1_examples: ["第一条 合同内容"]
            level_2_examples: ["一、合同总价"]
            level_3_examples: ["（一）付款条件"]
          variant_1:
            level_1_examples: ["一、合作背景"]
            level_2_examples: ["（一）通信业务合作", "（3）新技术与新业务合作"]
            level_3_examples: ["1. 基础服务", "2、增值服务"]
      paragraph:
        split_threshold_tokens: 1000
        chunk_target_tokens: 700
      hierarchy:
        input_max_tokens: 20000
        batch_target_tokens: 16000
        batch_overlap_tokens: 800
        max_levels: 6
        retry_count: 3
      table:
        split_threshold_tokens: 20000
        chunk_target_tokens: 18000
      attachment:
        max_levels: 6
      summary:
        batch_max_nodes: 10
        batch_max_tokens: 20000
    routing:
      criteria: "resources/criteria/criteria-formal.docx"
      expected_criteria_count: 18
      fallback_enabled: true
      methods:
        title: "检查目录、标题、章节名称、必备标题和标题顺序。"
        region: "限定合同首部、正文、尾部或附件后，在区域内执行结构语义、向量召回和重排。"
        rule: "执行全文精确关键词、正则、金额和存在性定位。"
        scan: "按 token 预算把全部 anchor 分批交给 LLM 逐项检查。"
        hybrid: "无法限定标题、区域或精确关键词时，执行全局结构语义、向量召回和重排。"
      llm_candidates: 12
      vector_candidates: 20
      vector_threshold: 0.45
      max_nodes: 5
    concurrency:
      llm: 10
      embedding: 1
      reranker: 10

api:
  require_request_model_config: false
  keep_input: true
  keep_output: true
  result_output_default: "file"
  result_upload_enabled: false
  result_upload_domain: "http://64.202.33.42:30843"
  result_upload_path: "/openapi/agentar/v1/attachment/batchUploadAttachmentFile.json"
  result_upload_authorization: ""
  result_upload_timeout_seconds: 60
  meta_required: true
  meta_fields:
    - "templateCode"
    - "serialNo"
  callback_enabled: false
  callback_url: ""
  callback_file_field: "file"
  url_download_timeout_seconds: 60
  url_download_max_size: "50MB"

docx:
  comment_include_criterion: false

logging:
  enabled: false
