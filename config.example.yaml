llm:
  # Production / Test:
  # name: qwen3.6-35b-a3b
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  name: qwen3.6-27b
  enable_thinking: false
  max_context_tokens: 254000
  max_prompt_tokens: 88000
  max_result_tokens: 64000
  max_tool_calls: 25
  temperature: 0.0
  top_p: 0.01
  seed: 42
embedding:
  # Production (BGE):
  # base_url: "http://<production-embedding-host>/v1"
  # name: bge-m3
  #
  # Test (Qwen):
  # base_url: "http://<test-embedding-host>/v1"
  # name: qwen3-embedding
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  name: text-embedding-v4
  max_input_tokens: 8000
rerank:
  # Production (BGE):
  # base_url: "http://<production-reranker-host>/<rerank-path>"
  # name: bge-reranker-v2-m3
  # provider_model_names:
  #   bge: [bge-reranker-v2-m3]
  #
  # Test (Qwen / Higress):
  # base_url: "http://<test-reranker-host>/<rerank-path>"
  # name: qwen3-reranker
  # provider_model_names:
  #   higress_qwen: [qwen3-reranker]
  base_url: http://higress.llmgateway.dev.qa.zrub.com/v1/rerank
  name: Qwen3-Reranker-8B
  # Model names select the request protocol; add the exact deployment name here.
  provider_model_names:
    higress_qwen:
    - Qwen3-Reranker-8B
    - qwen3-reranker
    bge:
    - bge-reranker-v2-m3
    dashscope_qwen:
    - qwen3-rerank
    - gte-rerank-v2
  instruct: Given a contract review query, retrieve relevant institutional policy
    passages.
workflow:
  max_reflection_rounds: 10
  max_orchestrator_concurrency: 2
  model_call_timeout_seconds: 60
  model_call_max_retries: 2
  criterion_retry_max_attempts: 2
  subagent_allowed_tools:
  - contract_search
queue:
  broker_url: redis://redis:6379/0
  pending_timeout_seconds: 60
  queued_timeout_seconds: 7200
  watchdog_interval_seconds: 10
  worker_disable_prefetch: true
  task_time_limit_seconds: 1800
model_semaphore:
  llm:
    max_concurrent_requests: 5
    redis_url: redis://redis:6379/2
    key: contract_agent:model:llm:semaphore
    lease_seconds: 600
    poll_interval_seconds: 0.2
  embedding:
    max_concurrent_requests: 3
    redis_url: redis://redis:6379/2
    key: contract_agent:model:embedding:semaphore
    lease_seconds: 600
    poll_interval_seconds: 0.2
  reranker:
    max_concurrent_requests: 10
    redis_url: redis://redis:6379/2
    key: contract_agent:model:reranker:semaphore
    lease_seconds: 600
    poll_interval_seconds: 0.2
retrieval:
  backend: llamaindex
  docxindex:
    input_tokens: 20000
    output_tokens: 12000
    scan_batch_tokens: 6000
    vector:
      enabled: true
      score_threshold: 0.45
      probe_limit: 20
    semantic:
      structure_candidate_limit: 12
      max_selected_nodes: 10
    rerank:
      enabled: true
    routing:
      fallback_enabled: true
api:
  require_request_model_config: false
  keep_input: true
  keep_output: true
  result_output_default: file
  result_upload_enabled: false
  result_upload_domain: http://64.202.33.42:30843
  result_upload_path: /openapi/agentar/v1/attachment/batchUploadAttachmentFile.json
  result_upload_authorization: ''
  result_upload_timeout_seconds: 60
  meta_required: true
  meta_fields:
  - templateCode
  - serialNo
  callback_enabled: false
  callback_url: ''
  callback_file_field: file
  url_download_timeout_seconds: 60
  url_download_max_size: 50MB
docx:
  comment_include_criterion: false
logging:
  enabled: false
  detailed: false
