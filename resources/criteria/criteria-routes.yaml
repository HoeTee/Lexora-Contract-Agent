version: 1
criteria_count: 18
policies:
- id: H01
  section: 合同主体
  criterion: 合同提供信息是否齐全，包括联系地址、联系电话、传真、法定代表人或负责人、联系人等信息，如无。则在合同首部写明“注意：请补充合同基本信息（具体的信息）”
  check_points:
  - 完整读取合同首部，逐字段判断合同编号、主体名称、地址、联系电话、传真、法定代表人或负责人、联系人、签订日期等信息是否真实填写；占位形态不固定，不得使用正则代替语义判断。
  - 每个未填写字段分别形成问题并锚定该字段，不得把多个字段合并到同一处批注。
  route:
    steps:
    - method: region
      regions:
      - frontmatter
      coverage: complete
    fallback: false
  placement:
    target: inline
    note: 未填写字段分别批注在对应首部原文处。
- id: H02
  section: 合同框架
  criterion: 合同框架内需要具备至少以下标题：保密条款、验收、知识产权、甲方义务、乙方义务、甲方违约责任、乙方违约责任、不可抗力、（合同的补充、变更与解除）、诚信廉洁合作承诺、适用法律及合同争议解决、合同的生效及合同份数、双方约定的其他事项、附件。
  check_points:
  - 根据完整一级标题目录逐项核对审查标准列出的必备标题；只判断标题是否存在，不得根据标题推断其正文内容为空。
  route:
    steps:
    - method: title
      all_titles: true
    fallback: false
  placement:
    target: summary
    note: 缺失标题属于全局结构问题，写入 AI 审查总结。
- id: H03
  section: 合同框架
  criterion: 合同当中是否出现项目负责人，并且检查是否对该负责人预留了姓名、身份证号码及电话号码。
  check_points:
  - 全文检查项目负责人字段，以及姓名、身份证号码和电话号码是否均有真实填写。
  - 占位、空白和示例值由模型结合字段语义判断，不使用固定占位符正则。
  route:
    steps:
    - method: scan
    fallback: false
  placement:
    target: inline
    note: 在对应负责人字段处分别批注。
- id: H04
  section: 合同框架
  criterion: 如果合同名称出现“采购”二字，就直接在合同首部写明“注意：采购内容中品种、规格、型号、等级、花色等应具体注明，必要时可通过附件说明标的物的实际情况”。
  check_points:
  - 完整读取合同首部并判断合同名称是否含有“采购”。
  review_instruction: 注意：采购内容中品种、规格、型号、等级、花色等应具体注明，必要时可通过附件说明标的物的实际情况
  route:
    steps:
    - method: region
      regions:
      - frontmatter
      coverage: complete
    fallback: false
  placement:
    target: summary
    note: 关键词触发的固定提示写入 AI 审查总结。
- id: H05
  section: 合同框架
  criterion: 如果合同目录中出现“金额”二字，就直接在合同首部写明“注意：合同金额中数量、价款要明确，包括数额的计量单位，同时写明标的物的单价、总价、币种等”。
  check_points:
  - 检查完整一级标题目录中是否存在含“金额”的标题。
  review_instruction: 注意：合同金额中数量、价款要明确，包括数额的计量单位，同时写明标的物的单价、总价、币种等
  route:
    steps:
    - method: title
      all_titles: true
    fallback: false
  placement:
    target: summary
    note: 关键词触发的固定提示写入 AI 审查总结。
- id: H06
  section: 合同框架
  criterion: 如果合同目录中出现“支付方式”四字，对于这个标题下的内容进行检索。如果发现付款计划只有一条，需要直接在标题处提醒“注意：建议分期付款。”此外，付款计划要有明确节点确认付款，应预留一部分金额待免费维保期结束后支付，并且明确发票类型。是否付款计划所有总和与合同总金额不一致（不同类别的支付计划分别加总（百分比、金额）计算核验
    数字后面是否添加单位，加总计算）
  check_points:
  - 找到支付方式标题后完整读取其所属章节，核对付款期数、明确付款节点、维保期尾款和发票类型。
  - 分别计算百分比与金额付款计划的合计，并核对单位及其与合同总金额的一致性。
  route:
    steps:
    - method: region
      anchor_terms:
      - 支付方式
      coverage: complete
    fallback: false
  placement:
    target: inline_at_title
    note: 章节整体问题锚定支付方式标题，具体字段问题锚定对应原文。
- id: H07
  section: 合同框架
  criterion: 合同期限：正文中约定具体的合同履行期限，可按照年度、季度、月、旬、日计算；同时，明确各期限的概念，如自然日或工作日、自然季度或从起始日开始计算至第三个月同一日的前一天等，避免模棱两可的语言。如果没有合同日期，则在合同首部写明“补充合同履行期限”。
  check_points:
  - 检查正文约定的履行期限是否具体，并明确自然日、工作日等期限概念。
  - 未约定履行期限时，明确要求在合同首部补充合同履行期限。
  route:
    steps:
    - method: hybrid
      terms:
      - 合同期限
      - 履行期限
      - 服务期限
      - 交付期限
    fallback: false
  placement:
    target: inline
    note: 已有但不明确的期限锚定原文；完全缺失时进入首部。
- id: H08
  section: 合同框架
  criterion: 如果合同目录中出现“违约责任”四字，就直接在合同首部写明“注意：涉及对方违约责任应明确具体，设置兜底条款，对于除明确约定的违约情形外的其他对方违约情形，也明确相应的违约责任。”
  check_points:
  - 检查完整一级标题目录中是否存在含“违约责任”的标题。
  review_instruction: 注意：涉及对方违约责任应明确具体，设置兜底条款，对于除明确约定的违约情形外的其他对方违约情形，也明确相应的违约责任。
  route:
    steps:
    - method: title
      all_titles: true
    fallback: false
  placement:
    target: summary
    note: 关键词触发的固定提示写入 AI 审查总结。
- id: H09
  section: 合同框架
  criterion: 全文检索如果没有“甲方住所地人民法院”，在合同首部写明“注意：缺少甲方住所地人民法院”。
  check_points:
  - 根据确定性全文检索结果判断是否存在“甲方住所地人民法院”。
  review_instruction: 注意：缺少甲方住所地人民法院
  route:
    steps:
    - method: rule
      terms:
      - 甲方住所地人民法院
    fallback: false
  placement:
    target: summary
    note: 确认缺失时写入 AI 审查总结。
- id: H10
  section: 合同框架
  criterion: 合同主体名称和签订主体名称首尾须保持一致，例如甲乙方信息需要分别保持一致。
  check_points:
  - 分别从完整合同首部和完整签署栏提取甲方、乙方实际名称，并按同一角色进行首尾比较。
  - 任一侧未填写时只报告对应字段未填写，不得输出令人费解的一致性结论；两侧均为有效值时才判断不一致。
  route:
    steps:
    - method: region
      regions:
      - frontmatter
      coverage: complete
    - method: region
      regions:
      - tail
      coverage: complete
    fallback: false
  placement:
    target: inline
    note: 不一致问题锚定需要修改的一侧，另一侧仅作为证据。
- id: H11
  section: 合同框架
  criterion: 校验相同条款在正文与附件中约定是否一致。
  check_points:
  - 根据审查标准寻找正文与附件对同一事项的约定；附件作为客观基准，正文与附件不一致时修改正文。
  - 不得把正文不存在的额外要求补写到附件，也不得在没有两侧证据时编造一致性问题。
  route:
    steps:
    - method: region
      regions:
      - body
      coverage: relevant
    - method: region
      regions:
      - attachments
      coverage: relevant
    fallback: false
  placement:
    target: inline
    note: 锚定需要修改的正文，附件对应内容作为证据。
- id: H12
  section: 其他基本问题
  criterion: 是否有错别字。
  check_points:
  - 逐段检查合同中的明确错别字，只报告可由原文直接证明的问题。
  route:
    steps:
    - method: scan
    fallback: false
  placement:
    target: inline
    note: 锚定具体错别字。
- id: H13
  section: 其他基本问题
  criterion: 是否标题顺序杂乱。
  check_points:
  - 根据完整一级标题目录检查同层级标题编号是否重复、不连续或顺序错误；不得检查附件标题是否带书名号。
  route:
    steps:
    - method: title
      all_titles: true
    fallback: false
  placement:
    target: summary
    note: 标题顺序作为一个全局结构问题合并说明。
- id: H14
  section: 其他基本问题
  criterion: 是否存在合同金额大小写不一致。
  check_points:
  - 找出合同金额的大写与小写金额并进行语义核对；人民币大写金额换算由模型判断。
  route:
    steps:
    - method: hybrid
      terms:
      - 合同金额
      - 大写
      - 小写
      - 人民币
    fallback: false
  placement:
    target: inline
    note: 不一致时锚定金额原文。
- id: H15
  section: 其他基本问题
  criterion: 是否存在语句语病，例如挨着重复这类“一致一致”、一句话主语缺失。
  check_points:
  - 逐段检查相邻重复词、主语缺失和其他有明确语法依据的语病，不得将措辞偏好当作错误。
  route:
    steps:
    - method: scan
    fallback: false
  placement:
    target: inline
    note: 锚定具体语病原文且每处只保留一条批注。
- id: H16
  section: 其他基本问题
  criterion: 是否存在如下相关招标单位、谈判单位、投标单位等其他流程中相关敏感词：招标单位、中标单位、投标单位、谈判单位、谈判响应单位、采购人、投标人、入围单位、征集单位。
  check_points:
  - 仅检查标准明确列举的九个敏感词，不得扩张到“中标通知书”“中标资格”“招标文件”“响应文件”或“标书”。
  route:
    steps:
    - method: rule
      terms:
      - 招标单位
      - 中标单位
      - 投标单位
      - 谈判单位
      - 谈判响应单位
      - 采购人
      - 投标人
      - 入围单位
      - 征集单位
    fallback: false
  placement:
    target: inline
    note: 仅锚定实际命中的敏感词。
- id: H17
  section: 其他基本问题
  criterion: 正文最后，正文结尾处是否写上“以下为合同签署栏”或“以下无正文”的内容，如无，在正文结尾处写入“注意：补充“以下为合同签署栏”或“以下无正文””。
  check_points:
  - 完整读取合同末尾和签署栏，检查正文内容结束处是否存在“以下为合同签署栏”或“以下无正文”。
  review_instruction: 注意：补充“以下为合同签署栏”或“以下无正文”
  route:
    steps:
    - method: region
      regions:
      - tail
      coverage: complete
    fallback: false
  placement:
    target: body_end
    note: 缺失时锚定索引提供的正文内容结束边界。
- id: H18
  section: 其他基本问题
  criterion: 正文结尾处提到附件是否附在正文后，名称是否一致。
  check_points:
  - 从正文附件目录或正文引用中提取附件名称，并与正文后实际附件标题逐项比较。
  - 不得评论书名号样式；附件存在时不得仅因标题样式不同断言附件缺失。
  route:
    steps:
    - method: region
      regions:
      - body
      coverage: relevant
    - method: region
      regions:
      - attachments
      coverage: complete
    fallback: false
  placement:
    target: inline
    note: 名称不一致时锚定正文引用，实际附件标题作为客观证据。
