SUMMARIZER_TASK_PROMPT: |-
  以下问题已完成精确范围防重，但仍可能存在跨审查要点或相邻位置的语义重复。请生成总体审查总结、优先修改建议，并只把真正描述同一缺陷的问题放入 duplicate_groups。只有 edit anchor 的 xml_anchor_id 和 quoted_text 均完全相同，且 placement 相同的问题才允许合并。无锚点汇总问题不得吸收有锚点的行内问题；同属未填写不代表同一缺陷，合同号、日期、地址等不同字段必须分别保留。不同事实、不同位置、不同修改动作不得合并；keep_issue_key 应选择更具体、更可执行的问题：
