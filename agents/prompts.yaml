  --- SubAgent 补充检索证据 ---

ORCHESTRATOR_REVIEW_TASK: |+
  审查标准：${criterion_text}
  检查要点：
  ${check_points_text}

  执行约束：
  - 检索结果中的确定性计数和范围说明是已经执行完毕的代码结论，不是待核实信息。
  - 若审查标准以某词语缺失为触发条件，且确定性全文检索明确显示出现次数为0，必须输出 issues_found，不得输出 compliant。
  - 若审查标准要求在触发后‘直接写明’或‘如无则写入’指定提示，且检索结果证明触发条件成立，必须按该标准输出 issue，不得再以风险较低、已有相关实体条款或一般完善建议为由跳过。

  - 若当前标准只要求比较两处内容是否一致，任一侧为空白、模板变量或未填写时，不得在该一致性标准下输出字段缺失问题；只有两侧均为实际有效值且内容不一致时才能报告 inconsistency。

  - 输出前必须逐条检查字段长度：issue_comment 不得超过600个字符，anchor.comment_text 不得超过300个字符；需要说明多个事实时应保留核心缺陷和修改要求，不得用超长背景复述合同。

  - 检索结果若含‘检索候选判定理由’，表示 scan 已逐项发现该原文可能触发当前标准；必须逐条作出实质判断。原文确为未填写时必须分别输出 issue，只有能从该原文看出已实际填写或不属于标准范围时才可排除。

  以下是合同原文中与此标准相关的内容：

  ${context}

ORCHESTRATOR_COVERAGE_AUDIT: |+
  完整覆盖审计：必须对上述每一个检索证据锚点输出一条 coverage_decisions，不得遗漏或重复。
  每条记录只能包含且必须完整填写 xml_anchor_type、xml_anchor_id、decision、reason 四个字段；禁止使用 anchor_id 等自创字段。xml_anchor_type 和 xml_anchor_id 必须逐字符复制同一检索证据对象，不得填写 null 或字符串 "null"。decision 只能为 issue、compliant、not_applicable。
  decision=issue 时必须同时生成锚定同一 xml_anchor_type/xml_anchor_id 的 edit issue；decision=compliant/not_applicable 时不得为同一证据生成 edit issue，且必须在 reason 中说明与当前标准的关系。不得因为已经发现部分问题就跳过合同号、日期、联系方式等其他字段。
  以下仅为字段示例，锚点和理由必须替换为实际证据及实际判断：
  {"xml_anchor_type":"paragraph","xml_anchor_id":"path:body/p2","decision":"compliant","reason":"该证据已填写当前检查点要求的信息。"}

ORCHESTRATOR_COMPARISON_AUDIT: |-
  逐候选比较要求：
  待检查原文范围：${edit_region}
  对照证据范围：${evidence_region}
  必须覆盖每个待检查候选，不能漏项或添加不存在的位置。同一段原文包含多个比较对象时分别记录不同配对关系；同一原文位置与同一证据位置的配对不能重复。
  - matched：已找到相应证据且按当前检查点一致，必须填写证据类型和真实位置，不生成该候选的问题。
  - mismatch：已找到相应证据但按当前检查点不一致，必须填写证据位置，并生成锚定待检查原文的 edit 问题、以对照原文为 evidence。
  - not_found：候选需要的对照内容未在提供的证据中找到，证据类型和位置同时填 JSON null；按当前标准生成锚定候选的 edit 问题。
  - not_applicable：候选不属于当前检查范围，写明依据，不生成问题；没有实际配对证据时类型和位置同时填 JSON null。
  引用的类型与位置必须来自同一个实际证据对象，不能虚构、不能将 null 写成字符串。比较的业务要求只取自本次 criterion/check_points。
ORCHESTRATOR_TRIGGER_INSTRUCTION: |+
