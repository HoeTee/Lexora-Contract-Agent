ORCHESTRATOR_CONTEXT_GUIDANCE: 注意：下面内容中的“相关度分数”“检索片段标题”等仅是检索系统包装信息，不是合同原始条款标题或所在位置。输出”所在位置”时只能填写合同原文中真实出现的条款、章节或段落位置；若合同原文未标明具体条款编号，请写”合同缺失审查要点要求书写的内容”，绝对不要照抄检索包装标题。
ORCHESTRATOR_ANCHOR_GUIDANCE: 每条检索证据会提供 xml_anchor_type 和 xml_anchor_id。输出 anchors 时必须从 quoted_text 所在的同一证据对象逐字符复制 xml_anchor_type/xml_anchor_id；禁止根据证据展示顺序、批次编号、正文顺序或段落内容自行构造
  xml_anchor_id。输出前必须确认 quoted_text 是该 xml_anchor_id 对应合同文本中的单一连续片段。
