JSON_INITIAL_REQUEST_PROMPT: |-
  ${initial_prompt}

  输出 JSON 结构如下。仅输出 JSON；示例中的锚点、编号和事实必须替换为本次输入的真实值，不得照抄示例事实。只输出当前结构定义的字段，禁止新增字段。仅当当前结构包含 coverage_decisions 或 comparison_decisions 时，未要求执行对应审计则将该数组设为 []。
  ${expected_format}
JSON_REPAIR_PROMPT: |-
  你的上一次输出未通过 JSON/schema 校验。以下按字段归纳重复错误；完整错误已记录在日志中：
  ${errors}

