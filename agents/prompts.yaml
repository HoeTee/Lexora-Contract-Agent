REFLECTOR_REVIEW_TASK_PROMPT: |-
  字段职责：subagent_output 是唯一完整审查结果（含 edit 和 evidence）；current_findings 只是修改位置索引，不代表完整证据。
  finding_decisions 只能由 Reflector 返回，不要要求 SubAgent 添加该字段。finding_id 必须逐字复制输入的 F001 等编号，不是 issue_id。
  必须逐条判断所有 current_findings 和 missing_previous_findings：事实成立用 confirm，需要改写用 revise，事实不成立用 remove，并写明理由。
  audit_mode.coverage / audit_mode.comparison 是程序给定的审计开关，只有对应值为 true 时才执行逐项完整审计，不能由 subagent_output 中是否出现数组来开启。当前标准范围内有证据的实质漏检仍用 coverage_gaps 精确列出，不因关闭逐项审计而忽略；不得将已撤销的同一事实在没有新增证据或明确错误依据时重新列为漏检。
  结合 finding_history 核对前轮理由；推翻前轮决定时必须在 reason 指出新增证据或前轮具体错误。PASS 接受处理 confirm/remove 后的结果，允许 PASS+remove；存在 revise、需要恢复的历史 finding 或 coverage_gaps 时返回 REJECT。feedback 必须与 finding_decisions 一致，不能一处要求删除、另一处要求修订。
  一致性标准只比较两侧均已填写的有效值；任一侧为空白、模板变量或未填写时，必须移除该一致性标准下的字段缺失问题，不能把它确认为一致性问题。
  compliant + issues=[] 是合法结构，不得要求其提供 schema 未定义的顶层 reasoning 或为了引用证据而新增 issue。
  请审核以下审查结果的质量：

  SubAgent 输出：
  ${agent_output}

  以下是系统针对 anchors 为空的缺失类 issue 做的补充检索结果，仅用于判断缺失判断是否需要退回重审，不是 Reflector 输出字段：
  ${missing_text_review_notes}
  整体 status 应与逐条决定一致。程序以完整的 finding_decisions、coverage_gaps 和证据校验结果计算实际是否完成；feedback 只能解释决定，不能另设未在结构化决定中列出的修改要求。
